[server]
# Deaktiviert standardmäßige CORS-Schutzmaßnahmen,
# damit Seiten wie Power Pages die App im iframe laden können.
enableCORS = false

# Schaltet den XSRF-Schutz aus,
# der ebenfalls das Einbetten blockieren kann.
enableXsrfProtection = false

# Streamlit im headless-Modus starten (kein automatisches Browser-Öffnen).
headless = true

# Port, unter dem die App verfügbar sein soll.
port = 8501
